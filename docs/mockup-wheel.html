<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Life — 7 Areas wheel</title>
<style>
  :root{
    --ground:#EFE9D8; --surface:#FCFAF2; --surface2:#EAF2F8;
    --ink:#274B6B; --soft:#6E8093; --line:#E5DDCA; --sea:#3E7CA8; --sea-bg:#DCEAF3;
    --voice:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:'Avenir Next','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .wrap{font-family:var(--sans);color:var(--ink);background:var(--ground);min-height:100vh;padding:28px 24px 48px;}
  .head{max-width:1000px;margin:0 auto 20px;}
  .head h1{font-family:var(--voice);font-weight:400;font-size:30px;margin:0;}
  .head p{color:var(--soft);font-size:14px;margin:4px 0 0;}
  .layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  .card{background:var(--surface);border-radius:24px;padding:24px;}
  .wheelwrap{display:flex;justify-content:center;}
  svg.wheel{width:100%;max-width:480px;height:auto;overflow:visible;}
  svg.wheel text{font-family:var(--sans);fill:var(--ink);}
  .seg{cursor:pointer;transition:opacity .15s;}
  .seg:hover{opacity:.85;}

  .detail .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:8px;}
  .detail h2{font-family:var(--voice);font-weight:400;font-size:26px;margin:0;}
  .detail .score{font-size:15px;color:var(--soft);margin:2px 0 18px;}
  .detail .score b{font-size:22px;color:var(--ink);}
  .glabel{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 6px;}
  .glabel b{font-weight:600;}
  .bar{height:9px;border-radius:6px;background:var(--surface2);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:6px;}
  .note{font-size:13px;color:var(--soft);line-height:1.6;margin:18px 0 0;background:var(--surface2);border-radius:12px;padding:12px 14px;}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--sea);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-family:var(--sans);cursor:pointer;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;}
  .hint{font-size:12px;color:var(--soft);text-align:center;margin-top:10px;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}
</style>

<div class="wrap">
  <div class="head">
    <h1>7 areas of life</h1>
    <p>your balance at a glance — tap any slice to see the goals behind it</p>
  </div>
  <div class="layout">
    <div class="card">
      <div class="wheelwrap"><svg class="wheel" id="wheel" viewBox="-80 -14 560 428"></svg></div>
      <div class="hint">each slice fills from the center to its score (out of 10)</div>
    </div>
    <div class="card detail" id="detail"></div>
  </div>
</div>

<script>
  const AREAS=[
    {name:'Physical',score:6,color:'#4FA3A0',note:'Strength training is building; steps are steady. Weight holding near goal.',goals:[['Fitness — strength 5×/wk + 7,500 steps',62],['Health — hold 145 lb',70]]},
    {name:'Mental',score:5,color:'#4F7CA8',note:'Italian is the big lever this year. Reading picks up once the queue gets going.',goals:[['Italian — reach B1 + Harry Potter 1 in Italian',40],['Reading — 12 books in 2026',33]]},
    {name:'Emotional',score:7,color:'#8A6BA8',note:'Gratitude and journaling are your steadiest anchors.',goals:[['Gratitude — 3 a day',80],['Journal — 5×/week',70]]},
    {name:'Career',score:8,color:'#D08A5A',note:'Director now — 10/10 lands with the Sr Director promotion.',goals:[['Director → Sr Director',80]]},
    {name:'Financial',score:5,color:'#E0B24A',note:'Three clear targets: retirement, savings, and clearing the student loans.',goals:[['Retirement → $200k',34],['Savings → $25k',52],['Student loans → $0',22]]},
    {name:'Relationships',score:7,color:'#C77E92',note:'Keeping your core people close, and making room for love.',goals:[['Keep core people in touch',75],['Love — 1 date or event a month',50]]},
    {name:'Spiritual',score:8,color:'#6E9A5E',note:'Your center. Daily Mass and adoration carry this one.',goals:[['Mass 5×/wk · Adoration 5×/wk',85],['Rosary + Divine Mercy weekly',70],['Confession every 2 weeks',60]]}
  ];
  const CX=200,CY=200,R=150,N=AREAS.length,STEP=360/N;
  function pt(r,deg){const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
  function wedge(r,a0,a1){const[x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1);return `M${CX},${CY} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z`;}
  let selected=6;
  function draw(){
    let s='';
    // light background wedges
    AREAS.forEach((a,i)=>{s+=`<path d="${wedge(R,i*STEP,(i+1)*STEP)}" fill="${a.color}" opacity="0.13"/>`;});
    // filled score wedges
    AREAS.forEach((a,i)=>{s+=`<path d="${wedge(R*a.score/10,i*STEP,(i+1)*STEP)}" fill="${a.color}" opacity="0.9"/>`;});
    // ring grid
    for(let k=1;k<=10;k++){s+=`<circle cx="${CX}" cy="${CY}" r="${R*k/10}" fill="none" stroke="#274B6B" stroke-opacity="0.10"/>`;}
    // dividers
    for(let i=0;i<N;i++){const[x,y]=pt(R,i*STEP);s+=`<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#274B6B" stroke-opacity="0.18"/>`;}
    s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#274B6B" stroke-opacity="0.25" stroke-width="1.5"/>`;
    // selected highlight
    if(selected!=null){const a=AREAS[selected];s+=`<path d="${wedge(R,selected*STEP,(selected+1)*STEP)}" fill="none" stroke="${a.color}" stroke-width="4"/>`;}
    // labels
    AREAS.forEach((a,i)=>{const mid=i*STEP+STEP/2;const[lx,ly]=pt(R+26,mid);const anchor=Math.cos((mid-90)*Math.PI/180)>0.25?'start':Math.cos((mid-90)*Math.PI/180)<-0.25?'end':'middle';s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="13" font-weight="600" fill="${a.color}">${a.name}</text>`;});
    // clickable transparent wedges on top
    AREAS.forEach((a,i)=>{s+=`<path class="seg" data-i="${i}" d="${wedge(R,i*STEP,(i+1)*STEP)}" fill="transparent"/>`;});
    document.getElementById('wheel').innerHTML=s;
    document.querySelectorAll('.seg').forEach(el=>el.addEventListener('click',()=>{selected=+el.dataset.i;draw();detail();}));
  }
  function detail(){
    const a=AREAS[selected];
    document.getElementById('detail').innerHTML=
      `<h2><span class="dot" style="background:${a.color}"></span>${a.name}</h2>`+
      `<div class="score"><b>${a.score}</b> / 10 · averaged from your goals below</div>`+
      a.goals.map(g=>`<div class="glabel"><span>${g[0]}</span><b>${g[1]}%</b></div><div class="bar"><i style="width:${g[1]}%;background:${a.color}"></i></div>`).join('')+
      `<div class="note">${a.note}</div>`+
      `<button class="btn">Open ${a.name} goals <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`;
  }
  draw();detail();
</script>
